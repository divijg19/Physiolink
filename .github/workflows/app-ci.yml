name: App CI

on:
    pull_request:
        paths:
            - "app/**"
            - ".github/workflows/**"
    push:
        branches: [main]
    workflow_dispatch: {}

concurrency:
    group: app-ci-${{ github.head_ref || github.run_id }}
    cancel-in-progress: true

jobs:
    analyze:
        name: Analyze, test, build web
        runs-on: ubuntu-latest
        timeout-minutes: 45
        defaults:
            run:
                working-directory: app
        steps:
            - name: Checkout (shallow)
              uses: actions/checkout@v7
              with:
                  fetch-depth: 1

            - name: Setup Flutter
              uses: subosito/flutter-action@v2
              with:
                  channel: stable
                  cache: true

            - name: Cache Dart pub
              uses: actions/cache@v6
              with:
                  path: ~/.pub-cache
                  key: ${{ runner.os }}-pub-${{ hashFiles('app/pubspec.lock') }}
                  restore-keys: ${{ runner.os }}-pub-

            - name: Install dependencies
              run: flutter pub get

            - name: Regenerate code
              run: dart run build_runner build --delete-conflicting-outputs

            - name: Fail if generated code is stale
              shell: bash
              run: |
                  set -euo pipefail
                  # Stale .g.dart files from an older riverpod_generator do not
                  # compile at all, so drift must fail CI rather than ship.
                  if ! git diff --exit-code -- '*.g.dart' '*.freezed.dart'; then
                      # The backticks are meant to render literally in the log.
                      # shellcheck disable=SC2016
                      echo '::error::Generated code is out of date. Run `dart run build_runner build --delete-conflicting-outputs` in app/ and commit the result.'
                      exit 1
                  fi

            - name: Analyze
              run: flutter analyze --fatal-infos

            - name: Test
              run: flutter test --reporter=expanded

            - name: Build web (release)
              run: flutter build web --release
