name: Backend CI

on:
    pull_request:
        paths:
            - "backend/**"
            - ".github/actions/**"
            - ".github/workflows/**"
    push:
        branches: [main]
    workflow_dispatch: {}

concurrency:
    group: backend-ci-${{ github.head_ref || github.run_id }}
    cancel-in-progress: true

jobs:
    unit:
        name: Unit tests, lint, vulncheck
        runs-on: ubuntu-latest
        timeout-minutes: 60
        defaults:
            run:
                working-directory: backend
        steps:
            - name: Checkout (shallow)
              uses: actions/checkout@v7
              with:
                  fetch-depth: 1

            - name: Setup Go, cache and install tools
              uses: ./.github/actions/go-setup
              with:
                  install-staticcheck: "true"
                  install-gotestsum: "true"
                  install-govulncheck: "true"

            - name: Run go vet
              run: go vet ./...

            - name: Run staticcheck
              run: staticcheck ./...

            - name: Verify go.sum integrity
              run: go mod verify

            - name: Scan for vulnerabilities
              shell: bash
              run: |
                  set -o pipefail
                  govulncheck ./... 2>&1 | tee govulncheck.txt

            - name: Check compilation
              run: go build ./...

            - name: Run unit tests
              run: |
                  # Unquoted on purpose: the package list must split into
                  # separate arguments. Package paths contain no spaces.
                  # shellcheck disable=SC2046
                  gotestsum --junitfile unit-tests.xml -- -race -coverprofile=coverage.out $(go list ./... | grep -v /integration/)

            - name: Upload test results
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: test-results
                  path: |
                      backend/unit-tests.xml
                      backend/coverage.out
                      backend/govulncheck.txt

    docker:
        name: Docker build
        runs-on: ubuntu-latest
        timeout-minutes: 60
        defaults:
            run:
                working-directory: backend
        steps:
            - name: Checkout (shallow)
              uses: actions/checkout@v7
              with:
                  fetch-depth: 1

            - name: Build Docker image
              run: docker build -t physiolink-backend:ci .
