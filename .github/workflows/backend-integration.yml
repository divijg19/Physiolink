name: Backend Integration Tests

on:
    pull_request:
        paths:
            - "backend/**"
            - ".github/actions/**"
            - ".github/workflows/backend-integration.yml"
    push:
        branches: [main]
    workflow_dispatch: {}

concurrency:
    group: backend-integration-${{ github.head_ref || github.run_id }}
    cancel-in-progress: true

timeout-minutes: 120

env:
    DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable

jobs:
    integration:
        name: Integration tests
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:15
                env:
                    POSTGRES_PASSWORD: postgres
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
        defaults:
            run:
                working-directory: backend
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 1

            - uses: ./.github/workflows/go-setup
              with:
                  install-gotestsum: "true"

            - name: Wait for Postgres
              run: |
                  until pg_isready -h localhost -p 5432 -U postgres; do sleep 1; done
              env:
                  PGPASSWORD: postgres

            - name: Apply migrations
              run: |
                  for f in migrations/*.sql; do psql "$DATABASE_URL" -f "$f"; done

            - name: Run integration tests
              run: |
                  gotestsum --junitfile integration-tests.xml -- -race -coverprofile=integration-coverage.out ./integration -v

            - name: Upload test results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: integration-test-results
                  path: |
                      backend/integration-tests.xml
                      backend/integration-coverage.out