name: Backend Integration Tests

on:
    pull_request:
        paths:
            - "backend/**"
            - ".github/actions/**"
            - ".github/workflows/**"
    push:
        branches: [main]
    workflow_dispatch: {}

concurrency:
    group: backend-integration-${{ github.head_ref || github.run_id }}
    cancel-in-progress: true

env:
    DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable

jobs:
    integration:
        name: Integration tests
        runs-on: ubuntu-latest
        timeout-minutes: 120
        services:
            postgres:
                image: postgres:15
                env:
                    POSTGRES_PASSWORD: postgres
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
        defaults:
            run:
                working-directory: backend
        steps:
            - name: Checkout (shallow)
              uses: actions/checkout@v7
              with:
                  fetch-depth: 1

            - name: Setup Go, cache and install tools
              uses: ./.github/actions/go-setup
              with:
                  install-gotestsum: "true"

            - name: Wait for Postgres
              shell: bash
              run: |
                  set -euo pipefail
                  until pg_isready -h localhost -p 5432 -U postgres; do sleep 1; done
              env:
                  PGPASSWORD: postgres

            - name: Apply migrations
              shell: bash
              run: |
                  set -euo pipefail
                  for f in migrations/*.sql; do
                      echo "::group::applying $f"
                      psql -v ON_ERROR_STOP=1 --single-transaction "$DATABASE_URL" -f "$f"
                      echo "::endgroup::"
                  done

            - name: Run integration tests
              run: |
                  gotestsum --junitfile integration-tests.xml -- -race -coverprofile=integration-coverage.out ./integration -v

            - name: Upload test results
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: integration-test-results
                  path: |
                      backend/integration-tests.xml
                      backend/integration-coverage.out
