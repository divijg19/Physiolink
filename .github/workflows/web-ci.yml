name: Web CI

on:
    pull_request:
        paths:
            - "web/**"
            - ".github/actions/**"
            - ".github/workflows/**"
    push:
        branches: [main]
    workflow_dispatch: {}

concurrency:
    group: web-ci-${{ github.head_ref || github.run_id }}
    cancel-in-progress: true

jobs:
    build:
        name: Analyze, test, build
        runs-on: ubuntu-latest
        timeout-minutes: 60
        defaults:
            run:
                working-directory: web
        steps:
            - name: Checkout (shallow)
              uses: actions/checkout@v7
              with:
                  fetch-depth: 1

            - name: Setup Dart
              uses: dart-lang/setup-dart@v1

            - name: Cache Dart pub
              uses: actions/cache@v6
              with:
                  path: ~/.pub-cache
                  key: ${{ runner.os }}-pub-${{ hashFiles('web/pubspec.lock') }}
                  restore-keys: ${{ runner.os }}-pub-

            - name: Install dependencies
              run: dart pub get

            - name: Analyze
              run: dart analyze --fatal-infos

            - name: Install jaspr CLI
              run: dart pub global activate jaspr_cli 0.23.5

            - name: Build
              run: dart pub global run jaspr_cli:jaspr build

            - name: Verify SPA build output is embeddable
              shell: bash
              run: |
                  set -euo pipefail
                  test -f build/jaspr/index.html || { echo '::error::build/jaspr/index.html missing'; exit 1; }
                  test -f build/jaspr/main.dart.js || { echo '::error::build/jaspr/main.dart.js missing'; exit 1; }
                  echo "SPA build output verified: $(find build/jaspr -type f | wc -l) files"
