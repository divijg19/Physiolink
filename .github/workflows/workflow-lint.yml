name: CI Config Lint

# Deliberately broad: this is the one workflow that must run when CI or repo
# infrastructure changes, because every other workflow has a paths filter and
# would otherwise silently not run at all. A PR touching only compose.yaml or
# the Makefile previously triggered zero checks, which left it unverifiable.
on:
    pull_request:
        paths:
            - ".github/**"
            - "compose.yaml"
            - "docker-compose.yml"
            - "docker-compose.*.yml"
            - "Makefile"
            - "backend/Dockerfile"
            - "backend/go.mod"
            - "backend/go.sum"
    push:
        branches: [main]
    workflow_dispatch: {}

concurrency:
    group: ci-config-lint-${{ github.head_ref || github.run_id }}
    cancel-in-progress: true

jobs:
    actionlint:
        name: actionlint
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Checkout (shallow)
              uses: actions/checkout@v7
              with:
                  fetch-depth: 1

            # Catches invalid workflow schema, which GitHub reports only as
            # "This run likely failed because of a workflow file issue" with
            # zero jobs - no step output, nothing to grep. A top-level
            # `timeout-minutes` (valid only per job) broke all five workflows
            # that way, and nothing else in the pipeline would have noticed.
            - name: Lint workflows
              uses: docker://rhysd/actionlint:1.7.7
              with:
                  args: -color

    compose:
        name: compose config
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Checkout (shallow)
              uses: actions/checkout@v7
              with:
                  fetch-depth: 1

            # Only present on branches that carry the compose stack.
            - name: Validate compose file
              if: ${{ hashFiles('compose.yaml', 'docker-compose.yml') != '' }}
              run: docker compose config --quiet

    makefile:
        name: make targets
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Checkout (shallow)
              uses: actions/checkout@v7
              with:
                  fetch-depth: 1

            # `make doctor` exits non-zero on a missing tool, and parses every
            # target, so a malformed Makefile fails here rather than silently.
            - name: Parse Makefile
              run: make -n doctor >/dev/null
