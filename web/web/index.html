<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="scaffolded-by" content="https://github.com/schultek/jaspr">

        <title>jaspr_web</title>

        <!--
            The SPA is served by the Go backend under /site. This base href
            makes jaspr_router's Link() and the relative asset URLs below
            resolve against /site/ instead of the server root.
        -->
        <base href="/site/">

        <link rel="stylesheet" href="styles.css">

        <!--
            Loads and runs the compiled 'main.dart' file,
            can be changed to any other .dart file inside /web.
        -->
        <script defer src="main.dart.js"></script>
    </head>
    <body>
        <!-- Your app component will be inserted here. -->
    </body>
</html>
